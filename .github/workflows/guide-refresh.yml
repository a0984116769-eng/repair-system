# 攻略自動更新（下一站）
#
# 每週一檢查一次：整理日期超過 30 天的攻略，請伺服器用當初的條件重新上網搜尋、重寫，
# 網址不變。每次最多更新 6 篇（每篇約用 4 次 Tavily 搜尋與 1 次 Gemini），控制免費額度。
#
# - 伺服器也會擋下 30 天內已更新過的攻略，所以不會重複更新。
# - 還沒設定 Tavily 搜尋金鑰、或這次全部更新失敗時，會在儲存庫開 Issue，GitHub 會寄信通知。
# - 單篇失敗時保留原本的內容，下週再試。
# - 只使用 publishable key（本來就公開在網頁的 config.js 裡），不需要任何 secret。
# - 也可以到 Actions 頁面，選這個工作後按「Run workflow」手動執行。

name: 攻略自動更新

on:
  schedule:
    # 每週一 UTC 02:07（台灣時間 10:07）
    - cron: "7 2 * * 1"
  workflow_dispatch:

permissions:
  actions: write # 只用來重新啟用排程
  issues: write # 失敗時開 Issue 通知
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://ltmuuxslnawhwzguosyi.supabase.co
      # publishable key：公開金鑰，網頁本來就會用到；絕對不要在這裡放 secret key
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fe1LosrmJmkJSieOKVwHwA_DBRUkPX6
      MAX_PER_RUN: "6"
      REFRESH_DAYS: "30"
    steps:
      - name: 找出需要更新的攻略並重新產生
        id: refresh
        run: |
          # 台灣時間的今天往前 30 天
          cutoff=$(date -u -d "+8 hours -${REFRESH_DAYS} days" +%F)
          echo "更新整理日期在 $cutoff（含）以前的攻略，最多 $MAX_PER_RUN 篇"
          : > due.json
          code=$(curl -sS -o due.json -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/travel_guides?select=id,country,city,compiled_on&compiled_on=lte.$cutoff&order=compiled_on.asc&limit=$MAX_PER_RUN" || true)
          code=${code:-000}
          if [ "$code" != "200" ]; then
            echo "reason=讀取攻略清單失敗（HTTP $code），Supabase 專案可能已被暫停" >> "$GITHUB_OUTPUT"
            echo "::error::讀取攻略清單失敗（HTTP $code）"
            exit 1
          fi
          total=$(jq 'length' due.json)
          {
            echo "## 攻略自動更新"
            echo
            echo "需要更新：$total 篇（整理日期 ≤ $cutoff）"
            echo
            echo "| 攻略 | 原整理日期 | 結果 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "沒有需要更新的攻略"
            exit 0
          fi
          ok=0
          failed=0
          lines=""
          for row in $(jq -r '.[] | @base64' due.json); do
            id=$(echo "$row" | base64 -d | jq -r '.id')
            name=$(echo "$row" | base64 -d | jq -r '[.country, .city] | map(select(. != null and . != "")) | join("・")')
            date=$(echo "$row" | base64 -d | jq -r '.compiled_on')
            result=""
            for attempt in 1 2; do
              : > out.json
              rcode=$(curl -sS -o out.json -w '%{http_code}' --max-time 160 -X POST \
                -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"regenerate_id\":\"$id\"}" \
                "$SUPABASE_URL/functions/v1/generate-guide" || true)
              rcode=${rcode:-000}
              msg=$( (jq -r '.error // ""' out.json 2>/dev/null || true) | tr '\r\n' '  ' | sed 's/^ *//; s/ *$//')
              verified=$(jq -r '.web_verified // false' out.json 2>/dev/null || echo false)
              if [ "$rcode" = "200" ]; then
                result="✅ 已更新（上網搜尋：$verified）"
                break
              fi
              if [ "$rcode" = "503" ] && echo "$msg" | grep -q "TAVILY_API_KEY"; then
                echo "reason=Supabase 後台還沒設定搜尋金鑰 TAVILY_API_KEY，所以沒有更新任何攻略" >> "$GITHUB_OUTPUT"
                echo "| $name | $date | ❌ 沒有搜尋金鑰 |" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::$msg"
                exit 1
              fi
              result="❌ HTTP $rcode ${msg:-伺服器沒有回傳內容}"
              # AI 忙碌或逾時時等一分鐘再試一次；409（30 天內已更新）不重試
              case "$rcode" in 429|502|503|504|000) [ "$attempt" -lt 2 ] && sleep 60 ;; *) break ;; esac
            done
            echo "$name（$date）：$result"
            echo "| $name | $date | $result |" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in ✅*) ok=$((ok + 1)) ;; *) failed=$((failed + 1)); lines="$lines$name（$date）：$result；" ;; esac
          done
          echo "成功 $ok 篇，失敗 $failed 篇"
          if [ "$ok" -eq 0 ]; then
            echo "reason=這次 $failed 篇全部更新失敗：$lines" >> "$GITHUB_OUTPUT"
            echo "::error::全部更新失敗"
            exit 1
          fi

      - name: 失敗時開 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ steps.refresh.outputs.reason }}
        run: |
          {
            echo "「下一站」的攻略自動更新失敗了，攻略內容沒有更新（原本的內容都還在）。"
            echo
            echo "- 原因：${REASON:-（請看執行紀錄）}"
            echo "- 執行紀錄：$RUN_URL"
            echo
            echo "常見原因："
            echo "- 「沒有搜尋金鑰」：到 Supabase 後台 → Edge Functions → Secrets 新增 TAVILY_API_KEY。"
            echo "- 「AI 目前太忙碌」「額度用完」：通常是暫時的，下週會自動再試。"
            echo "- Tavily 每月 1,000 次的免費額度用完：下個月 1 日重置，或到 Tavily 升級方案。"
            echo "- 讀取攻略清單失敗：Supabase 專案可能被暫停，到後台恢復。"
          } > issue.md
          gh issue create --repo "${{ github.repository }}" \
            --title "攻略自動更新失敗（$(date -u +%Y-%m-%d)）" --body-file issue.md

      - name: 重新啟用排程（避免 60 天沒活動被 GitHub 停用）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/guide-refresh.yml/enable" \
            && echo "已重新啟用 guide-refresh.yml" \
            || echo "::warning::無法重新啟用 guide-refresh.yml"
